<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wei 的拍賣小舖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: 跳蚤市場攤位。頁首是攤位招牌與付款方式，接著是不用拍照的銅板價籃子，
   再來是可篩選的商品卡片牆；每張卡片右下角貼一張黃色價格貼紙。 */
:root {
  --bg: #eef6fd; --surface: #ffffff; --ink: #1f3a5c; --muted: #6582a3; --line: #d3e4f5;
  --accent: #2b74c7; --accent-ink: #ffffff; --awning: #6fb0ee;
  --tag: #ffd83d; --tag-ink: #3a2c00;
  --hold: #b86a00; --hold-bg: #fff1d6; --sold: #8494a8; --sold-bg: #e6edf5;
  --photo: #dcecfb;
  --display: "Fredoka", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1c2c; --surface: #17283d; --ink: #e6eff9; --muted: #9bb1c9; --line: #284058;
  --accent: #7db8f5; --accent-ink: #08203a; --awning: #4a8fd4;
  --tag: #ffd83d; --tag-ink: #3a2c00;
  --hold: #ffc266; --hold-bg: #3d2d10; --sold: #8b9bb0; --sold-bg: #213247;
  --photo: #1f3650; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1c2c; --surface: #17283d; --ink: #e6eff9; --muted: #9bb1c9; --line: #284058;
  --accent: #7db8f5; --accent-ink: #08203a; --awning: #4a8fd4;
  --tag: #ffd83d; --tag-ink: #3a2c00;
  --hold: #ffc266; --hold-bg: #3d2d10; --sold: #8b9bb0; --sold-bg: #213247;
  --photo: #1f3650; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
img { max-width: 100% }
body { margin: 0 }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6 }
.wrap { max-width: 980px; margin: 0 auto; padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 28px }
h1, h2, h3, p { margin: 0 }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 7vw, 40px); line-height: 1.15; text-wrap: balance }
h2 { font-size: 18px; font-weight: 700 }
.sub { color: var(--muted) }
.notice { font-size: 14px; color: var(--hold); background: var(--hold-bg); padding: 10px 14px; border-radius: 12px }

header { background: var(--surface); border-radius: 24px; overflow: hidden; box-shadow: 0 3px 0 var(--line) }
.awning { height: 26px; background: repeating-linear-gradient(90deg, var(--awning) 0 32px, var(--surface) 32px 64px) }
.scallop { height: 16px; background:
  radial-gradient(circle at 16px 0, var(--awning) 15.5px, transparent 16px) 0 0 / 64px 16px repeat-x,
  radial-gradient(circle at 16px 0, var(--line) 15.5px, transparent 16px) 32px 0 / 64px 16px repeat-x }
.head-in { padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 12px }
.bank { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px }
.bank code { font-family: var(--display); font-size: 16px; font-variant-numeric: tabular-nums; user-select: all; letter-spacing: .04em }
.copy { font: inherit; font-size: 13px; color: var(--accent); background: transparent; border: 1px solid var(--accent); border-radius: 999px; padding: 2px 12px; cursor: pointer }
.card, .basket { box-shadow: 0 3px 0 var(--line) }
.basket { background: var(--surface) }
.pay { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px }
.pay span.lbl { color: var(--muted) }
.pay b { font-weight: 500; border: 1px solid var(--line); background: var(--surface); padding: 3px 10px; border-radius: 999px }

section { display: flex; flex-direction: column; gap: 12px }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.sec-head small { color: var(--muted); font-size: 13px }

/* 籃子 */
.baskets { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px }
.basket { display: flex; gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 20px; padding: 14px; min-width: 0 }
.basket > div { min-width: 0 }
.basket h3 { font-size: 15px; font-weight: 700 }
.basket p { font-size: 13px; color: var(--muted) }
.sticker { flex: none; background: var(--tag); color: var(--tag-ink); font-family: var(--display); font-weight: 600;
  font-variant-numeric: tabular-nums; border-radius: 50%; width: 68px; height: 68px; display: grid; place-content: center;
  text-align: center; line-height: 1.05; transform: rotate(-6deg) }
.sticker small { font-family: var(--body); font-size: 11px; font-weight: 500 }
.sticker span { font-size: 22px }

/* 篩選 */
.tools { display: flex; flex-direction: column; gap: 10px }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none }
.chips::-webkit-scrollbar { display: none }
.chip { flex: none; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  padding: 6px 14px; border-radius: 999px; cursor: pointer }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
input[type="search"], select { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0 }
input[type="search"] { flex: 1 1 160px }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* 商品卡 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(158px, 1fr)); gap: 12px }
.card { font: inherit; color: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 0; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-width: 0 }
.photo { position: relative; aspect-ratio: 1; background: var(--photo); display: grid; place-content: center; font-size: 56px; overflow: hidden }
.photo img, .d-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover }
.d-photo img { object-fit: contain }
.no { position: absolute; top: 8px; left: 8px; background: var(--surface); color: var(--ink); font-family: var(--display);
  font-size: 13px; font-weight: 500; padding: 1px 8px; border-radius: 6px; font-variant-numeric: tabular-nums }
.price { position: absolute; right: 8px; bottom: 8px; background: var(--tag); color: var(--tag-ink); font-family: var(--display);
  font-weight: 600; font-size: 20px; padding: 2px 10px; border-radius: 8px; transform: rotate(-4deg); font-variant-numeric: tabular-nums }
.info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1 }
.name { font-weight: 700; font-size: 15px; line-height: 1.35 }
.meta { font-size: 12.5px; color: var(--muted) }
.meta s { margin-right: 4px }
.status { align-self: flex-start; margin-top: auto; font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px }
.status.ok { color: var(--accent); border: 1px solid var(--accent) }
.status.hold { color: var(--hold); background: var(--hold-bg) }
.status.sold { color: var(--sold); background: var(--sold-bg) }
.card.is-sold .photo, .card.is-sold .name { opacity: .45 }
.card.is-sold .price { text-decoration: line-through }
.empty { color: var(--muted); padding: 24px 0; text-align: center }

/* 詳細視窗 */
dialog { border: 0; border-radius: 18px; padding: 0; width: min(440px, calc(100vw - 32px)); background: var(--surface); color: var(--ink) }
dialog::backdrop { background: rgba(8, 20, 17, .55) }
.d-photo { aspect-ratio: 4 / 3; background: var(--photo); display: grid; place-content: center; font-size: 96px; position: relative }
.d-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px }
.d-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
.d-price { font-family: var(--display); font-weight: 600; font-size: 28px; font-variant-numeric: tabular-nums; white-space: nowrap }
.d-body h3 { font-size: 19px; line-height: 1.3 }
form.reserve { display: flex; gap: 8px; flex-wrap: wrap }
form.reserve input { flex: 1 1 140px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0 }
.btn { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; background: var(--accent); color: var(--accent-ink) }
.btn.ghost { background: transparent; color: var(--muted); font-weight: 500; border: 1px solid var(--line) }
.d-msg { font-size: 13.5px; color: var(--muted) }
footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px }
.nav { position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--surface); color: var(--ink); font-size: 18px; line-height: 1; z-index: 1 }
.nav.prev { left: 8px } .nav.next { right: 8px }
.d-photo .no, .d-photo .dots { z-index: 1 }
.dots { position: absolute; bottom: 8px; right: 10px; background: var(--surface); color: var(--ink); font-size: 12px; padding: 0 8px; border-radius: 999px; font-variant-numeric: tabular-nums }
a.btn { text-decoration: none; text-align: center }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="awning"></div><div class="scallop"></div>
    <div class="head-in">
      <h1>Wei 的拍賣小舖</h1>
      <p class="sub">歡迎光臨！商品上貼的編號和這裡的 #編號 相同，看到喜歡的直接來攤位找我。</p>
      <div class="pay"><span class="lbl">付款方式</span><b>現金</b><b>LINE Pay</b><b>玉山銀行轉帳</b></div>
      <div class="bank" id="bank" hidden><span class="sub">玉山銀行（808）</span><code id="acct"></code><button class="copy" type="button" id="copy">複製帳號</button></div>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <section aria-labelledby="h-basket" id="sec-basket" hidden>
    <div class="sec-head"><h2 id="h-basket">銅板價籃子</h2><small>現場自己挑，不一一列出</small></div>
    <div class="baskets" id="baskets"></div>
  </section>

  <section aria-labelledby="h-items">
    <div class="sec-head"><h2 id="h-items">單件商品</h2><small id="count">載入中…</small></div>
    <div class="tools">
      <div class="chips" id="chips"></div>
      <div class="row">
        <input type="search" id="q" placeholder="搜尋品名或編號" aria-label="搜尋品名或編號">
        <select id="sort" aria-label="排序">
          <option value="no">依編號</option>
          <option value="asc">價格低到高</option>
          <option value="desc">價格高到低</option>
        </select>
        <label class="check"><input type="checkbox" id="avail"> 只看還能買的</label>
      </div>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>沒有符合的商品，換個分類或關鍵字試試。</p>
  </section>

  <footer>想要的東西可以先預訂，我會幫你保留到拍賣會當天。價格可小議，一次買多件再優惠。</footer>
</div>

<dialog id="dlg" aria-labelledby="d-name">
  <div class="d-photo" id="d-photo"></div>
  <div class="d-body">
    <div class="d-top"><h3 id="d-name"></h3><span class="d-price" id="d-price"></span></div>
    <p class="meta" id="d-meta"></p>
    <p id="d-desc"></p>
    <a class="btn" id="reserve" target="_blank" rel="noopener" hidden>我要預訂</a>
    <p class="d-msg" id="d-msg"></p>
    <button class="btn ghost" type="button" id="close">關閉</button>
  </div>
</dialog>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
